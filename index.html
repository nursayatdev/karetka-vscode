<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Каретка</title>
<link rel="icon" type="image/png" href="assets/icon.png">
<link rel="apple-touch-icon" href="assets/icon.png">
<style>
  :root{
    --bg:#08090b;
    --paper-dark:#5d636a;
    --paper-mid:#62686f;
    --ink:#16171a;
    --ui:#1a1c20;
    --ui-line:#2a2d33;
    --ui-fg:#c9ccd2;
    --amber:#ffb347;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ui-fg);
    font-family:"Segoe UI",system-ui,sans-serif;user-select:none;cursor:default}
  body.typing{cursor:none}

  #room{position:fixed;inset:0;
    background:radial-gradient(120% 80% at 50% 70%,#15171b 0%,#0a0b0d 55%,#050506 100%)}

  #stage{position:fixed;inset:0;perspective:1500px;perspective-origin:50% 35%}
  #tilt{position:absolute;left:0;top:0;width:100%;height:100%;transform-style:preserve-3d;transition:none !important;
    transition:transform .6s cubic-bezier(.2,.8,.2,1)}

  /* Paper */
  #paperAnchor{position:absolute;left:50%;top:0;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
  /* the sheet wrapping over the rubber platen: a lit cylindrical band of paper */
  #curl{position:absolute;height:34px;transform:translateZ(29px);pointer-events:none;overflow:hidden;
    border-radius:3px 3px 0 0;
    background:linear-gradient(180deg,rgba(98,104,111,0) 0%,#666c73 18%,#8a9096 46%,#a8adb2 58%,#6c7278 76%,#2f3337 100%);
    box-shadow:inset 1px 0 0 rgba(255,255,255,.25),inset -1px 0 0 rgba(255,255,255,.25)}
  #curlHot{position:absolute;top:0;width:700px;height:100%;margin-left:-350px;
    background:radial-gradient(ellipse 50% 120% at 50% 55%,rgba(255,252,240,.85),rgba(255,252,240,0) 70%);transition:opacity .5s}
  body.lampOff #curlHot{opacity:.1}
  #paper{position:absolute;left:0;top:0;will-change:transform}
  #paper.anim,#paper.anim .light,#paper.anim .glow{transition:transform .085s cubic-bezier(.3,.7,.3,1),opacity .5s}
  #paper.cr,#paper.cr .light,#paper.cr .glow{transition:transform .42s cubic-bezier(.65,0,.25,1),opacity .5s}
  #paper.view,#paper.view .light,#paper.view .glow{transition:transform .25s ease-out,opacity .5s}
  /* A4 sheet: 210 x 297 */
  .page{position:absolute;left:0;overflow:hidden;border-radius:2px;
    background:
      linear-gradient(180deg,rgba(0,0,0,.28) 0,rgba(0,0,0,0) 26px),
      linear-gradient(90deg,rgba(0,0,0,.22),rgba(0,0,0,0) 5%,rgba(0,0,0,0) 95%,rgba(0,0,0,.22)),
      var(--paper-mid);
    /* paper thickness: lit top & side edges, a backing sheet behind, soft cast shadow */
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.55),inset 1px 0 0 rgba(255,255,255,.3),inset -1px 0 0 rgba(255,255,255,.3),
      0 -2px 0 #9ca1a6, 0 -3.5px 0 #50555b,
      7px -9px 0 -1px #45494f, 7px -10px 0 -1px #7d8288,
      0 40px 90px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.6)}
  .grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:multiply;pointer-events:none;background-size:256px 256px}
  .pnum{position:absolute;left:0;right:0;text-align:center;font-family:"Courier New",monospace;font-weight:700;color:var(--ink);opacity:.55}
  .light{position:absolute;left:0;top:0;width:1200px;height:760px;pointer-events:none;will-change:transform;
    filter:blur(26px);opacity:.95}
  .cone{position:absolute;inset:0;
    background:
      radial-gradient(ellipse 22% 30% at 50% 100%,rgba(255,252,242,1) 0%,rgba(255,250,236,.0) 100%),
      radial-gradient(ellipse 50% 85% at 50% 100%,rgba(250,247,238,.95) 0%,rgba(236,234,226,.5) 40%,rgba(220,222,224,.12) 75%,rgba(220,222,224,0) 100%);
    clip-path:polygon(46% 100%,54% 100%,96% 4%,4% 4%)}
  .glow{position:absolute;left:0;top:0;width:1600px;height:1100px;pointer-events:none;
    background:radial-gradient(ellipse 50% 50% at 50% 70%,rgba(225,228,232,.3),rgba(0,0,0,0) 70%)}
  body.lampOff .light{opacity:0}
  body.lampOff .glow{opacity:.35}

  .text{position:absolute;left:0;top:0;
    font-family:"Courier New",Courier,monospace;font-weight:700;color:var(--ink);white-space:pre}
  .ln{position:absolute;left:0;height:1px}
  .c{position:absolute;top:0;display:block;text-align:center}
  .c.fresh{animation:strike .16s ease-out}
  @keyframes strike{0%{opacity:0;transform:var(--t) translateY(-3px) scale(1.25);filter:blur(1.2px)}
    35%{opacity:1;filter:blur(.2px)}100%{transform:var(--t)}}

  /* Platen rail */
  /* rubber platen roller */
  #rail{position:absolute;height:34px;transform:translateZ(30px);border-radius:8px;
    background:
      linear-gradient(180deg,#4a5059 0%,#262a31 22%,#15181d 55%,#0b0d10 85%,#050607 100%);
    box-shadow:0 12px 30px rgba(0,0,0,.75),inset 0 1px 0 rgba(255,255,255,.18),inset 0 -2px 4px rgba(0,0,0,.6)}
  #railRings{position:absolute;left:0;right:0;top:9px;height:2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.14) 20%,rgba(255,255,255,.22) 50%,rgba(255,255,255,.14) 80%,transparent);filter:blur(.5px)}
  /* chrome guide rod the carriage rides on */
  #rod{position:absolute;height:9px;transform:translateZ(34px);border-radius:5px;
    background:linear-gradient(180deg,#f2f4f6 0%,#9aa1a9 35%,#3d4249 70%,#7b828a 100%);
    box-shadow:0 4px 8px rgba(0,0,0,.6)}
  /* knurled platen knobs */
  .knob{position:absolute;width:48px;height:92px;transform:translateZ(36px);border-radius:14px;
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,.22) 0 2px,rgba(255,255,255,.12) 2px 3px,rgba(0,0,0,0) 3px 5px),
      linear-gradient(90deg,#4f555c 0%,#c9ced3 30%,#eef0f2 42%,#a3a9b0 60%,#4a4f56 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -3px 6px rgba(0,0,0,.45),0 14px 24px rgba(0,0,0,.7)}
  .knob::after{content:"";position:absolute;left:6px;right:6px;top:-6px;height:12px;border-radius:50%;
    background:radial-gradient(ellipse at 50% 40%,#f4f5f6,#9ea4ab 70%,#5b6168);box-shadow:0 1px 2px rgba(0,0,0,.5)}
  .guide{position:absolute;width:10px;height:30px;transform:translateZ(33px);border-radius:3px;
    background:linear-gradient(90deg,#5b6168,#e4e7ea 45%,#8a9098);box-shadow:0 4px 6px rgba(0,0,0,.6)}
  /* side housings */
  .pod{position:absolute;width:220px;transform:translateZ(26px);border-radius:44px 44px 18px 18px;-webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent);
    background:
      radial-gradient(ellipse 70% 30% at 50% 0%,rgba(255,252,240,.35),rgba(255,252,240,0) 70%),
      var(--brush),
      linear-gradient(180deg,hsl(var(--mh),var(--ms),74%) 0%,hsl(var(--mh),var(--ms),62%) 18%,hsl(var(--mh),var(--ms),47%) 45%,hsl(var(--mh),var(--ms),26%) 80%,hsl(var(--mh),var(--ms),15%) 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.7),inset 0 0 0 1px rgba(0,0,0,.25),inset 0 -40px 60px rgba(0,0,0,.35),
      0 30px 60px rgba(0,0,0,.75)}
  .pod::before{content:"";position:absolute;inset:8px 8px auto 8px;height:calc(100% - 16px);border-radius:38px 38px 12px 12px;
    border:1px solid rgba(0,0,0,.14);box-shadow:0 1px 0 rgba(255,255,255,.18)}
  .dial{position:absolute;left:50%;top:66px;width:86px;height:86px;margin-left:-43px;border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%,#d9dde1 0 22px,#2a2e34 22px 24px,transparent 24px),
      repeating-conic-gradient(#8d939a 0 4deg,#c9cdd2 4deg 8deg);
    box-shadow:0 6px 12px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.5),0 0 0 4px #33373d,0 0 0 5px rgba(255,255,255,.12)}
  .dial i{position:absolute;left:50%;top:9px;width:4px;height:14px;margin-left:-2px;border-radius:2px;background:#ffad3b;box-shadow:0 0 8px rgba(255,170,60,.9)}
  .podlbl{position:absolute;left:0;right:0;text-align:center;font:700 10px "Segoe UI",sans-serif;letter-spacing:.28em;color:rgba(20,22,25,.55);
    text-shadow:0 1px 0 rgba(255,255,255,.35)}
  .grille{position:absolute;left:30px;right:30px;top:70px;height:96px;border-radius:18px;
    background:radial-gradient(circle,#0d0f12 0 2.2px,transparent 2.6px) 0 0/10px 10px,linear-gradient(180deg,#6d737a,#4b5057);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.6),0 1px 0 rgba(255,255,255,.35)}
  .pled{position:absolute;left:50%;top:186px;width:12px;height:12px;margin-left:-6px;border-radius:50%;
    background:radial-gradient(circle,#fff3c4,#ffad3b 55%,#c26b00);box-shadow:0 0 0 3px #1a1c20,0 0 10px rgba(255,170,60,.9),0 0 26px rgba(255,150,40,.35)}
  #lever{position:absolute;width:150px;height:12px;transform:translateZ(40px) rotate(-28deg);transform-origin:100% 50%;
    border-radius:6px;background:linear-gradient(180deg,#f5f6f7,#a8aeb5 45%,#4b5057);
    box-shadow:0 8px 12px rgba(0,0,0,.6);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
  #lever::before{content:"";position:absolute;left:-14px;top:-8px;width:28px;height:28px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#fff,#b3b9bf 45%,#4a4f56);box-shadow:0 6px 10px rgba(0,0,0,.6)}
  #lever::after{content:"";position:absolute;right:-10px;top:-6px;width:24px;height:24px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#d7dbdf,#5b6168 70%);box-shadow:0 0 0 3px #2a2d32}
  #lever.pull{transform:translateZ(40px) rotate(-6deg);transition:transform .09s ease-in}
  /* machine body below the platen */
  #deck{position:absolute;transform:translateZ(22px);border-radius:26px 26px 0 0;-webkit-mask-image:linear-gradient(180deg,#000 55%,transparent);mask-image:linear-gradient(180deg,#000 55%,transparent);
    background:
      radial-gradient(ellipse 30% 60px at 50% 0%,rgba(255,250,235,.28),rgba(0,0,0,0) 100%),
      linear-gradient(180deg,#80868d 0%,#4a4f56 3%,#26292e 12%,#16181b 35%,#0a0b0d 70%,#060607 100%);
    box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 -10px 30px rgba(0,0,0,.6)}
  #deck::before{content:"";position:absolute;left:4%;right:4%;top:10px;height:6px;border-radius:3px;background:#07080a;box-shadow:0 1px 0 rgba(255,255,255,.15)}
  #railShade{position:absolute;left:-80%;width:260%;height:110px;transform:translateZ(10px);pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.45) 70%,rgba(0,0,0,.6))}
  #underShade{position:absolute;left:-80%;width:260%;height:120vh;transform:translateZ(20px);pointer-events:none;
    background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.85) 40%,#050506)}

  /* Head */
  /* shared "carriage" material: satin aluminium with a warm lamp reflection */
  :root{
    --mh:212;--ms:8%;
    --alu:linear-gradient(180deg,hsl(var(--mh),var(--ms),79%) 0%,hsl(var(--mh),var(--ms),67%) 22%,hsl(var(--mh),var(--ms),57%) 55%,hsl(var(--mh),var(--ms),44%) 82%,hsl(var(--mh),var(--ms),35%) 100%);
    --brush:repeating-linear-gradient(90deg,rgba(255,255,255,.014) 0 1px,rgba(0,0,0,.012) 1px 2px,rgba(255,255,255,0) 2px 3px);
  }
  #headShadow{position:absolute;left:50%;width:190px;height:34px;margin-left:-95px;transform:translateZ(31px);
    background:radial-gradient(ellipse at 50% 50%,rgba(0,0,0,.75),rgba(0,0,0,0) 70%);filter:blur(4px)}
  #head{position:absolute;left:50%;width:150px;height:68px;margin-left:-75px;transform:translateZ(46px);
    border-radius:34px;
    background:
      radial-gradient(ellipse 60% 55% at 50% -12%,rgba(255,252,240,.75),rgba(255,252,240,0) 70%),
      var(--brush),var(--alu);
    box-shadow:
      inset 0 1.5px 0 rgba(255,255,255,.85),
      inset 0 -1px 0 rgba(255,255,255,.18),
      inset 0 -8px 14px rgba(0,0,0,.28),
      inset 0 0 0 1px rgba(0,0,0,.22),
      0 2px 0 #4a4f55, 0 4px 0 #34383d, 0 5px 0 #24272b,
      0 16px 26px rgba(0,0,0,.7), 0 34px 60px rgba(0,0,0,.45)}
  #head::before{content:"";position:absolute;left:14px;right:14px;top:3px;height:20px;border-radius:20px 20px 40% 40%;
    background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));filter:blur(.5px)}
  #head::after{content:"";position:absolute;inset:5px;border-radius:29px;border:1px solid rgba(0,0,0,.12);
    box-shadow:0 1px 0 rgba(255,255,255,.25)}
  #head.bump{animation:bump .12s ease-out}
  @keyframes bump{0%{margin-top:1.5px}100%{margin-top:0}}
  #neck{position:absolute;left:50%;top:-5px;width:26px;height:8px;margin-left:-13px;border-radius:5px 5px 2px 2px;
    background:linear-gradient(180deg,#3a3f46,#15181c);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 3px rgba(0,0,0,.6)}
  #leds{position:absolute;left:38px;top:24px;display:flex;gap:8px;z-index:1}
  .led{position:relative;width:18px;height:18px;border-radius:50%;
    background:radial-gradient(circle at 50% 60%,#3a3e44,#101215 70%);
    box-shadow:inset 0 2px 3px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.55),0 -1px 0 rgba(0,0,0,.25)}
  .led b{position:absolute;inset:4px;border-radius:50%;transition:all .35s;
    background:radial-gradient(circle at 50% 55%,#4b3a24,#1d1712 80%);box-shadow:inset 0 1px 2px rgba(0,0,0,.9)}
  .led b::after{content:"";position:absolute;left:2px;top:1.5px;width:4px;height:3px;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(.3px)}
  .led.on b{background:radial-gradient(circle at 50% 50%,#fff8de 0%,#ffd27a 30%,#ffa62b 62%,#c86a00 100%);
    box-shadow:0 0 6px 1px rgba(255,170,60,.95),0 0 18px 4px rgba(255,140,30,.45),0 0 34px 8px rgba(255,140,30,.15)}
  .led.flick b{animation:flick .14s}
  @keyframes flick{50%{filter:brightness(1.35)}}
  #bar{position:absolute;left:50%;transform:translateZ(44px)}
  #stem{position:absolute;left:-3.5px;width:7px;height:46px;border-radius:1.5px;
    background:linear-gradient(90deg,#0b0c0e 0%,#2a2e34 30%,#5c626a 48%,#2a2e34 62%,#0b0c0e 100%);
    box-shadow:2px 0 4px rgba(0,0,0,.5)}
  #cap{position:absolute;left:-19px;width:38px;height:11px;border-radius:2.5px;
    background:linear-gradient(180deg,#5b616a 0%,#2c3036 30%,#15171a 100%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 3px 5px rgba(0,0,0,.6)}
  #slit{position:absolute;left:-25px;width:50px;height:4px;border-radius:2px;
    background:linear-gradient(90deg,rgba(255,255,255,.6),#fff 20%,#fff 80%,rgba(255,255,255,.6));
    box-shadow:0 0 6px #fff,0 0 16px rgba(255,255,245,.9),0 0 40px 6px rgba(255,250,230,.45)}
  body.lampOff #slit{background:#55595f;box-shadow:none}
  #bar.hit #stem,#bar.hit #cap{animation:hit .11s ease-out}
  @keyframes hit{0%{transform:translateY(-10px)}100%{transform:translateY(0)}}

  /* UI */
  .chrome{transition:opacity .6s}
  body.typing .chrome{opacity:0;pointer-events:none}
  #brand{position:fixed;left:22px;top:20px;display:flex;align-items:center;gap:10px;padding:8px 14px 8px 10px;
    background:var(--ui);border:1px solid var(--ui-line);border-radius:999px;font-size:13px;letter-spacing:.02em}
  #brand b{font-weight:600}
  #brand img{width:26px;height:26px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.6))}
  #brand{padding:6px 16px 6px 6px}
  #intro .wordmark{display:block;width:min(560px,80vw);margin:0 auto 26px;border-radius:14px;
    box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.8),0 0 120px rgba(255,200,120,.08);
    animation:rise .9s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
  #stats{position:fixed;right:22px;top:20px;text-align:right;font-size:12px;color:#8a8f97;line-height:1.6}
  #stats .pill{display:inline-flex;gap:8px;align-items:center;background:var(--ui);border:1px solid var(--ui-line);border-radius:999px;padding:7px 14px;color:var(--ui-fg);font-size:13px}
  /* 3D key panel in the carriage's material */
  #tools,#toolsL{position:fixed;right:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:11px;
    padding:14px 12px 16px 18px;border-radius:40px;
    background:linear-gradient(180deg,#25282d,#16181c);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -2px 6px rgba(0,0,0,.6),0 0 0 1px #0a0b0d,0 20px 50px rgba(0,0,0,.7)}
  :is(#tools,#toolsL) .sep{height:1px;margin:2px 4px 2px -2px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.1),transparent)}
  :is(#tools,#toolsL) button{all:unset;position:relative;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    color:#2b2f34;
    background:
      radial-gradient(ellipse 70% 50% at 50% 8%,rgba(255,252,240,.7),rgba(255,252,240,0) 70%),
      radial-gradient(circle at 50% 40%,#c3c8cd 0%,#a5abb2 45%,#7c828a 80%,#626870 100%);
    box-shadow:inset 0 1.5px 0 rgba(255,255,255,.85),inset 0 -3px 5px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.2),
      0 2px 0 #50555b,0 4px 0 #34383d,0 5px 1px #1c1e21,0 9px 14px rgba(0,0,0,.65);
    transition:transform .07s,box-shadow .07s,filter .2s}
  :is(#tools,#toolsL) button:hover{filter:brightness(1.08)}
  :is(#tools,#toolsL) button:active,:is(#tools,#toolsL) button.press{transform:translateY(4px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -1px 3px rgba(0,0,0,.25),inset 0 0 0 1px rgba(0,0,0,.25),
      0 1px 0 #34383d,0 2px 3px rgba(0,0,0,.6)}
  :is(#tools,#toolsL) svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;
    filter:drop-shadow(0 1px 0 rgba(255,255,255,.55))}
  :is(#tools,#toolsL) button.tg::before{content:"";position:absolute;left:-12px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;
    background:radial-gradient(circle,#fff3c4,#ffad3b 60%,#c26b00);box-shadow:0 0 6px rgba(255,170,60,.95),0 0 14px rgba(255,150,40,.4);transition:all .3s}
  :is(#tools,#toolsL) button.tg.off::before{background:#2a2d31;box-shadow:inset 0 1px 1px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.08)}
  :is(#tools,#toolsL) button.tg.off{color:#4d5258}
  :is(#tools,#toolsL) button::after{content:attr(data-tip);position:absolute;right:62px;top:50%;transform:translateY(-50%) translateX(6px);white-space:nowrap;
    background:#0d0e10;border:1px solid #2a2d33;color:#ddd;font:12px "Segoe UI",sans-serif;padding:6px 10px;border-radius:8px;opacity:0;pointer-events:none;transition:all .15s}
  :is(#tools,#toolsL) button:hover::after{opacity:1;transform:translateY(-50%)}
  #toolsL{right:auto;left:22px;padding:14px 18px 16px 12px}
  #toolsL button::after{right:auto;left:62px;transform:translateY(-50%) translateX(-6px)}
  #toolsL button:hover::after{transform:translateY(-50%)}
  #toolsL button.tg::before{left:auto;right:-12px}
  #toolsL .glyph{font:700 20px "Courier New",monospace;color:#2b2f34;text-shadow:0 1px 0 rgba(255,255,255,.55)}
  #toolsL button.tg.off .glyph{color:#4d5258}
  #bRib .dot{position:absolute;right:7px;bottom:7px;width:11px;height:11px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%,#5a5d62,#0c0d0f);box-shadow:0 0 0 2px #cfd3d7,0 1px 3px rgba(0,0,0,.6);transition:background .3s}
  #bRib.red .dot{background:radial-gradient(circle at 35% 30%,#ff8a82,#c02a30 60%,#6e1216)}
  #bInk .meter{position:absolute;left:12px;right:12px;bottom:6px;height:5px;border-radius:3px;background:rgba(0,0,0,.3);overflow:hidden;box-shadow:inset 0 1px 1px rgba(0,0,0,.5)}
  #bInk .meter b{display:block;height:100%;width:var(--ink,100%);background:linear-gradient(90deg,#14161a,#3c424a);transition:width .3s}
  #bInk.low .meter b{background:#c02a30}
  #bInk.low svg{color:#a3222a}
  #hint{position:fixed;left:50%;top:32px;white-space:nowrap;transform:translateX(-50%);font-size:12.5px;color:#6d727a;text-align:center;letter-spacing:.02em}

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const store = {
  get(k, d){ try{ const v = localStorage.getItem('karetka.'+k); return v===null? d : JSON.parse(v);}catch(e){return d;} },
  set(k, v){ try{ localStorage.setItem('karetka.'+k, JSON.stringify(v)); }catch(e){} }
};

/* ---------- Layout constants ---------- */
/* Real typewriter on A4: pica 10 chars/inch, 1" side & top margins, 1.5 line spacing */
const FONT = 23;
const meas = document.createElement('canvas').getContext('2d');
meas.font = `700 ${FONT}px "Courier New", Courier, monospace`;
const CW = Math.round(meas.measureText('M').width * 100) / 100;
const INCH = CW * 10;                          // 10 cpi
const PAGE_W = Math.round(INCH * 8.27);        // 210 mm
const PAGE_H = Math.round(PAGE_W * 297 / 210); // 297 mm
const COLS = Math.floor((PAGE_W - 2 * INCH) / CW);
const ML = Math.round((PAGE_W - COLS * CW) / 2);
const MT = Math.round(INCH);
const LH = Math.round(INCH / 4);               // 1.5 spacing (4 lines per inch)
const LPP = Math.floor((PAGE_H - MT - INCH * 1.1) / LH); // lines per page
const GAP = 140;                               // space between sheets in the stack

const paper = $('paper');
const tilt = $('tilt'), anchor = $('paperAnchor'), rail = $('rail'), rings = $('railRings');
const head = $('head'), bar = $('bar');
paper.style.width = PAGE_W + 'px';

/* ---------- State ---------- */
let lines = (store.get('text', '') || '').split('\n');
let settings = Object.assign({sound:true, amb:false, lamp:true, tiltOn:true, machine:'underwood', ribbon:0, ink:1, pure:false, latin:false, bold:false}, store.get('settings', {}));

/* per-character attributes, one int per char:
   machine(3 bits) | ribbon colour(1) | struck-out(1) | ink level 0..255 (8 bits) — the paper remembers how every letter was typed */
const encA = (m, c, k, s) => (m & 7) | ((c & 1) << 3) | ((s & 1) << 4) | (Math.round(Math.max(0, Math.min(1, k)) * 255) << 5);
const decA = v => ({m: v & 7, c: (v >> 3) & 1, s: (v >> 4) & 1, k: (v >> 5) / 255});

/* the machines: look of the print, ink behaviour, body colour and — above all — the sound */
const SND = o => Object.assign({hi:1, body:1, low:1, slug:1, clack:1, thump:1, ring:1, bellF:2050, bellD:1, ret:1, rattle:0, electric:0}, o);
const MACHINES = [
  {id:'underwood', name:'UNDERWOOD №5', h:212, s:'8%',  font:'"Courier New", Courier, monospace',           w:700, scale:1,    jit:1,   bleed:1.3, alpha:[.62,.38], ink:'#141518', red:'#a3222a', wear:1,
    snd:SND({})},
  {id:'olympia',   name:'OLYMPIA SM9',  h:150, s:'16%', font:'"Lucida Console", "Courier New", monospace',  w:400, scale:.97,  jit:.45, bleed:1.0, alpha:[.7,.3],   ink:'#16181b', red:'#a3222a', wear:.9,
    snd:SND({hi:1.12, body:.9, low:.95, slug:.8, clack:.85, thump:.9, ring:.7, bellF:2350, bellD:.8, ret:.85})},
  {id:'remington', name:'REMINGTON',    h:28,  s:'26%', font:'"Courier New", Courier, monospace',           w:700, scale:1.04, jit:1.7, bleed:2.0, alpha:[.7,.3],   ink:'#0e0f11', red:'#8f1d24', wear:1.2,
    snd:SND({hi:.85, body:1.15, low:.8, slug:1.15, clack:1.2, thump:1.35, ring:1.2, bellF:1760, bellD:1.5, ret:1.25})},
  {id:'selectric', name:'IBM SELECTRIC',h:208, s:'32%', font:'Consolas, "Courier New", monospace',         w:400, scale:1.0,  jit:.15, bleed:.6,  alpha:[.86,.14], ink:'#0f1114', red:'#b3262a', wear:.6,
    snd:SND({electric:1, hi:.9, body:.8, low:1.1, slug:.55, clack:.5, thump:.6, ring:.3, bellF:2750, bellD:.6, ret:.7})},
  {id:'romashka',  name:'РОМАШКА',      h:100, s:'14%', font:'"Courier New", Courier, monospace',           w:700, scale:.98,  jit:2.4, bleed:1.8, alpha:[.4,.6],   ink:'#202226', red:'#9c2a2a', wear:1.4,
    snd:SND({hi:1.1, body:1.3, low:.75, slug:1.1, clack:1.25, thump:.75, ring:1.6, bellF:1500, bellD:.7, ret:1.1, rattle:1})}
];
let mi = Math.max(0, MACHINES.findIndex(m => m.id === settings.machine));
let attrs = store.get('attrs', null); if (!Array.isArray(attrs)) attrs = [];
(function normAttrs(){
  const def = encA(0, 0, 1, 0);
  lines.forEach((ln, li) => { const n = [...ln].length; let a = Array.isArray(attrs[li]) ? attrs[li] : []; while (a.length < n) a.push(def); a.length = n; attrs[li] = a; });
  attrs.length = lines.length;
})();

/* which line breaks were made by the typewriter's own margin (soft) and which by Enter (hard) */
let wrapped = store.get('wrap', null); if (!Array.isArray(wrapped)) wrapped = [];
wrapped.length = lines.length; for (let i = 0; i < lines.length; i++) wrapped[i] = !!wrapped[i];

/* Kazakh Cyrillic → Latin (the 2021 alphabet) */
const KZ = {'а':'a','ә':'á','б':'b','в':'v','г':'g','ғ':'ǵ','д':'d','е':'e','ё':'io','ж':'j','з':'z','и':'i','й':'i','к':'k','қ':'q','л':'l','м':'m','н':'n','ң':'ń','о':'o','ө':'ó','п':'p','р':'r','с':'s','т':'t','у':'ý','ұ':'u','ү':'ú','ф':'f','х':'h','һ':'h','ц':'ts','ч':'ch','ш':'sh','щ':'shsh','ъ':'','ы':'y','і':'ı','ь':'','э':'e','ю':'iý','я':'ia'};
function toLatin(ch, prev, next){
  const lo = ch.toLowerCase(), m = KZ[lo];
  if (m === undefined) return ch;
  if (!m) return '';
  if (ch === lo) return m;
  if (lo === 'и' || lo === 'й') return 'İ';
  const up = c => c && c !== c.toLowerCase();             // ALL-CAPS word: ШАҢЫРАҚ → SHAŃYRAQ, not ShAŃYRAQ
  if (m.length > 1 && (up(prev) || up(next))) return m.toUpperCase();
  return m[0].toUpperCase() + m.slice(1);
}
let viewOff = 0;
let railY = 0;

function hash(a,b,c){ let h = 2166136261 ^ a; h = Math.imul(h ^ b, 16777619); h = Math.imul(h ^ c, 16777619); h ^= h>>>13; h = Math.imul(h, 0x5bd1e995); return ((h ^ (h>>>15))>>>0)/4294967296; }

/* ---------- Paper: a real 3D A4 sheet (WebGL) ----------
   Physics: the sheet is clamped where it leaves the rubber platen and stands up as a
   cantilever loaded by its own weight. Slope along the sheet (s = distance from the clamp,
   L = length of paper out of the machine):  θ(s) = θ0 + k·(3L²s − 3Ls² + s³)
   → curvature is largest right at the platen and the whole sheet leans back more and more
   (tip angle ∝ L³) as you type further down the page. Below the clamp the sheet wraps
   around the platen cylinder. Lighting is computed on the real curved surface. */
const P2 = PAGE_W / 2;
const THETA0 = 8 * Math.PI / 180;        // lean given by the paper table
const THETA_FULL = 44 * Math.PI / 180;   // extra tip angle when a whole A4 sheet is out
const K_BEND = THETA_FULL / Math.pow(PAGE_H, 3);
const R_PLATEN = 26;
const PERSP = 1500;
const TS = Math.min(2, Math.max(1.25, window.devicePixelRatio || 1));
const TW = Math.round(PAGE_W * TS), TH = Math.round(PAGE_H * TS);
const FONT_CSS = `700 ${FONT}px "Courier New", Courier, monospace`;

/* paper stock: warm white with grain and fibres */
const bgc = document.createElement('canvas'); bgc.width = TW; bgc.height = TH;
(() => {
  const g = bgc.getContext('2d');
  g.fillStyle = '#c3c8cf'; g.fillRect(0, 0, TW, TH);
  const im = g.getImageData(0, 0, TW, TH), d = im.data;
  for (let i = 0; i < d.length; i += 4){ const n = (Math.random() - .5) * 13; d[i] += n; d[i+1] += n; d[i+2] += n * .9; }
  g.putImageData(im, 0, 0);
  g.globalAlpha = .04; g.strokeStyle = '#6b6658'; g.lineWidth = .7;
  for (let i = 0; i < 1100; i++){ const x = Math.random()*TW, y = Math.random()*TH, a = Math.random()*Math.PI, l = (6 + Math.random()*26) * TS;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a)*l, y + Math.sin(a)*l); g.stroke(); }
  g.globalAlpha = 1;
})();
const tex = document.createElement('canvas'); tex.width = TW; tex.height = TH;
const tg = tex.getContext('2d');
let texPage = -1;
const fresh = [];            // struck characters still animating {li, ci, t0}
const dirtyLines = new Set();

let lastFont = '';
function drawChar(ch, li, ci, k){
  const a = decA((attrs[li] && attrs[li][ci]) || 0), M = MACHINES[a.m] || MACHINES[0];
  const r1 = hash(li, ci, 1), r2 = hash(li, ci, 2), r3 = hash(li, ci, 3), r4 = hash(li, ci, 4);
  const x = ML + ci * CW + CW / 2 + (r1 - .5) * 1.1 * M.jit;
  const y = MT + (li % LPP) * LH + LH * .72 + (r2 - .5) * 1.6 * M.jit;
  const font = `${settings.bold ? 700 : 400} ${(FONT * M.scale).toFixed(1)}px ${M.font}`;
  if (font !== lastFont) { tg.font = font; lastFont = font; }
  tg.setTransform(TS, 0, 0, TS, 0, 0);
  tg.translate(x, y); tg.rotate((r3 - .5) * 3.2 * M.jit * Math.PI / 180);
  if (k !== 1) tg.scale(k, k);
  tg.fillStyle = a.c ? M.red : M.ink;
  // a worn ribbon prints paler and patchier
  const al = Math.min(1, (M.alpha[0] + r4 * M.alpha[1]) * (.22 + .78 * a.k) * Math.max(.25, 1 - (k - 1) * 3) * (settings.bold ? 1 : 1.12));
  tg.globalAlpha = al;
  tg.shadowColor = a.c ? 'rgba(120,20,26,.8)' : 'rgba(10,10,14,.85)';
  tg.shadowBlur = (r2 > .8 ? M.bleed * 1.6 : M.bleed) * TS;
  tg.fillText(ch, 0, 0);
  if (a.s) { tg.globalAlpha = Math.min(1, al * 1.05); tg.rotate(.04); tg.fillText('x', .5, -.4); tg.fillText('x', -.3, .3); }
}
function paintRegion(top, bot, r0, r1){
  const y0 = Math.max(0, Math.floor(top * TS)), y1 = Math.min(TH, Math.ceil(bot * TS));
  if (y1 <= y0) return;
  tg.save();
  tg.setTransform(1, 0, 0, 1, 0, 0);
  tg.drawImage(bgc, 0, y0, TW, y1 - y0, 0, y0, TW, y1 - y0);
  tg.beginPath(); tg.rect(0, y0, TW, y1 - y0); tg.clip();
  lastFont = ''; tg.textAlign = 'center'; tg.textBaseline = 'alphabetic';
  const now = performance.now();
  for (let r = Math.max(0, r0); r <= Math.min(LPP - 1, r1); r++){
    const li = texPage * LPP + r; if (li >= lines.length) break;
    let ci = 0;
    for (const ch of lines[li]){
      if (ch !== ' '){
        const f = fresh.find(q => q.li === li && q.ci === ci);
        drawChar(ch, li, ci, f ? 1 + .28 * (1 - Math.min(1, (now - f.t0) / 140)) : 1);
      }
      ci++;
    }
  }
  if (bot > PAGE_H - INCH){ // page number
    tg.setTransform(TS, 0, 0, TS, 0, 0); tg.font = FONT_CSS; tg.fillStyle = '#141518'; tg.globalAlpha = .5; tg.shadowBlur = 0;
    tg.fillText(`— ${texPage + 1} —`, P2, PAGE_H - INCH * .55);
  }
  tg.restore();
  upload(y0, y1 - y0);
}
function paintPage(){ paintRegion(0, PAGE_H, 0, LPP - 1); }
function paintLine(r){ paintRegion(MT + r * LH - 7, MT + (r + 1) * LH + 9, r - 1, r + 1); }
function markDirty(li){ dirtyLines.add(li); }

/* ---- WebGL ---- */
const glc = document.createElement('canvas');
glc.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none';
$('stage').insertBefore(glc, tilt);
let gl = glc.getContext('webgl2', {antialias: true, alpha: true});
const GL2 = !!gl;
if (!gl) gl = glc.getContext('webgl', {antialias: true, alpha: true});
const VS = `
attribute vec3 aPos; attribute vec3 aNor; attribute vec2 aUV;
uniform vec2 uScreen; uniform vec2 uOrigin; uniform float uFit; uniform vec2 uRot;
uniform vec2 uPO; uniform float uD; uniform float uPush; uniform float uShift;
varying vec3 vP; varying vec3 vN; varying vec2 vUV;
void main(){
  vec3 q = aPos + aNor * uPush + vec3(uShift, 0., 0.);
  vec3 p = q - vec3(uOrigin, 0.);
  float cb = cos(uRot.y), sb = sin(uRot.y);
  p = vec3(p.x*cb + p.z*sb, p.y, -p.x*sb + p.z*cb);
  float ca = cos(uRot.x), sa = sin(uRot.x);
  p = vec3(p.x, p.y*ca - p.z*sa, p.y*sa + p.z*ca);
  p.xy *= uFit; p.xy += uOrigin;
  float s = uD / (uD - p.z);
  vec2 sc = uPO + (p.xy - uPO) * s;
  gl_Position = vec4(sc.x / uScreen.x * 2. - 1., 1. - sc.y / uScreen.y * 2., clamp(-p.z / 6000., -1., 1.), 1.);

}`;
const FS = `
precision highp float;
uniform sampler2D uTex; uniform vec3 uLamp; uniform vec3 uSpot; uniform float uLampOn; uniform float uBack;
varying vec3 vP; varying vec3 vN; varying vec2 vUV;
void main(){
  vec3 base = uBack > .5 ? vec3(.50, .52, .55) : texture2D(uTex, vUV).rgb;
  vec3 N = normalize(vN);
  vec3 L = uLamp - vP; float d = length(L); L /= d;
  float diff = max((dot(N, L) + .55) / 1.55, 0.);
  float spot = smoothstep(.42, .95, dot(-L, normalize(uSpot)));
  float att = 1. / (1. + pow(d / 760., 2.));
  float spill = exp(-pow(d / 380., 2.)) * .22;
  float key = uLampOn * (diff * spot * att * 1.55 + spill * diff * 1.4);
  float amb = (.55 + .12 * max(N.z, 0.) + .07 * max(-N.y, 0.)) * mix(1., .72, smoothstep(250., 1250., d));
  vec3 col = base * (amb + key * vec3(.97, .985, 1.));
  col = col / (1. + max(col - .9, 0.) * .6);
  float rim = (1. - smoothstep(0., .0022, vUV.x)) + smoothstep(.9978, 1., vUV.x) + (1. - smoothstep(0., .0016, vUV.y));
  col += rim * (.05 + .25 * key) * (1. - uBack);
  gl_FragColor = vec4(col, 1.);
}`;
function sh(type, src){ const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);

/* sheet shape for a given typing position v (page px of the baseline at the type guide) */
function sheetShape(v){
  const yType = railY - 76, yC = railY - 30;
  const vC = v + (yC - yType);                    // page v that sits at the platen clamp
  const L = Math.max(0, vC);                      // paper out of the machine
  const ds = 3, n = Math.ceil(L / ds) + 1;
  const Ys = new Float32Array(n + 1), Zs = new Float32Array(n + 1), Th = new Float32Array(n + 1);
  let y = yC, z = 0; Ys[0] = y; Zs[0] = 0; Th[0] = THETA0;
  for (let i = 1; i <= n; i++){
    const sm = (i - .5) * ds, th = THETA0 + K_BEND * (3*L*L*sm - 3*L*sm*sm + sm*sm*sm);
    y -= Math.cos(th) * ds; z -= Math.sin(th) * ds;
    Ys[i] = y; Zs[i] = z; const s = i * ds; Th[i] = THETA0 + K_BEND * (3*L*L*s - 3*L*s*s + s*s*s);

}
function sheetPoint(S, v){

    const f = (S.vC - v) / S.ds, i = Math.min(S.Ys.length - 2, Math.floor(f)), t = f - i;
    const th = S.Th[i] + (S.Th[i+1] - S.Th[i]) * t;
    return [S.Ys[i] + (S.Ys[i+1] - S.Ys[i]) * t, S.Zs[i] + (S.Zs[i+1] - S.Zs[i]) * t, -Math.sin(th), Math.cos(th)];
  }
  const b = Math.min((v - S.vC) / R_PLATEN, 2.3);            // wrapped round the platen
  return [S.yC + R_PLATEN * Math.sin(b), -R_PLATEN + R_PLATEN * Math.cos(b), Math.sin(b), Math.cos(b)];
}

/* camera math identical to the CSS 3D of #tilt inside #stage */
function project(x, y, z, fit, rxd, ryd){
  const ox = innerWidth / 2, oy = railY, a = rxd * Math.PI / 180, b = ryd * Math.PI / 180;
  let px = x - ox, py = y - oy, pz = z;
  let X = px * Math.cos(b) + pz * Math.sin(b), Z = -px * Math.sin(b) + pz * Math.cos(b);

    `<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/>` +
    `<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>` +
    `<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`;
  const rels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
    `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">` +
    `<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  return makeZip([
    {name:'[Content_Types].xml', data: ct}, {name:'_rels/.rels', data: rels},
